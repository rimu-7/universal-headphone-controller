name: Build Universal macOS DMG

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal DMG (Apple Silicon & Intel)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version || true

      - name: Build Universal App & DMG
        run: |
          chmod +x Scripts/build_app.sh Scripts/build_dmg.sh
          ./Scripts/build_dmg.sh

      - name: Verify Universal Binary
        run: |
          lipo -info HeadphoneController.app/Contents/MacOS/HeadphoneController

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeadphoneController-Universal-macOS
          path: HeadphoneController.dmg
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release & Upload Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          files: HeadphoneController.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
